# Pinned action SHAs, the container base image and Python dependencies stay current via weekly update PRs.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    ignore:
      # pydantic pins an exact pydantic-core; it is updated through pydantic, never on its own.
      - dependency-name: pydantic-core
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
